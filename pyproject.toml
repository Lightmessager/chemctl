[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemctl"
version = "0.1.0"
description = "Local computational chemistry workbench for humans and AI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "typer>=0.12", "httpx>=0.27", "platformdirs>=4", "cclib>=1.8.1,<2", "paramiko>=3", "PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chemctl = "chemctl.cli:main"
chemctl-gui = "chemctl.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemctl = ["assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
